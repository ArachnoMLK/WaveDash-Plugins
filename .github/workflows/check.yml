# Vérifie que packages/ et index.json correspondent aux sources de plugins/ (empreintes, versions, contenu).
name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/verify.mjs
